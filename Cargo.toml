[package]
name = "sa3-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "sa3_rs"
path = "src/lib.rs"

[[bin]]
name = "sa3-cli"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-23", "cuda"] }
ndarray = "0.17"
tokenizers = "0.21"
hound = "3"
rand = "0.9"
rand_distr = "0.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
serde_json = "1"

[build-dependencies]
ureq = "2"
